{% extends 'layout.html' %}
{% block title %}Shop{% endblock %}
{% block content %}
<h2>Shop</h2>
<div class="row">
    {% for p in products %}
    <div class="col-md-4 mb-3">
        <div class="card h-100">
            <img src="{{ p.image_url }}" class="card-img-top" alt="{{ p.name }}">
            <div class="card-body d-flex flex-column">
                <h5>{{ p.name }}</h5>
                <p class="text-muted">₹{{ p.price_inr }}</p>
                <p class="flex-grow-1">{{ p.description }}</p>
                <div>
                    <a href="/product/{{ p.id }}" class="btn btn-sm btn-primary">Details</a>
                    <a href="/add_to_cart/{{ p.id }}" class="btn btn-sm btn-outline-secondary">Add</a>
                </div>
            </div>
        </div>
    </div>
    {% endfor %}
</div>
{% endblock %}
