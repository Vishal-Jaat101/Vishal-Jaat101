{% extends 'layout.html' %}
{% block title %}Admin{% endblock %}
{% block content %}
<h2>Admin — Add / Remove Products</h2>
<form method="post" class="mb-3">
    <input type="hidden" name="add" value="1">
    <div class="row">
        <div class="col-md-4"><input name="name" class="form-control" placeholder="Product name"></div>
        <div class="col-md-4"><input name="price" class="form-control" placeholder="Price in INR"></div>
        <div class="col-md-4"><input name="image_url" class="form-control" placeholder="Image URL"></div>
    </div>
    <div class="mb-2 mt-2"><input name="description" class="form-control" placeholder="Short description"></div>
    <button class="btn btn-primary">Add product</button>
</form>

<h3>Existing products</h3>
<table class="table">
    <thead>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Price</th>
            <th></th>
        </tr>
    </thead>
    <tbody>
        {% for p in products %}
        <tr>
            <td>{{ p.id }}</td>
            <td>{{ p.name }}</td>
            <td>₹{{ p.price_inr }}</td>
            <td>
                <form method="post" style="display:inline">
                    <input type="hidden" name="remove" value="1">
                    <input type="hidden" name="product_id" value="{{ p.id }}">
                    <button class="btn btn-sm btn-danger">Remove</button>
                </form>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
