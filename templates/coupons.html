{% extends 'layout.html' %}
{% block title %}Coupons{% endblock %}
{% block content %}
<h2>Coupons</h2>
<ul class="list-group">
    {% for c in coupons %}
    <li class="list-group-item d-flex justify-content-between align-items-center">
        <div>
            <strong>{{ c.code }}</strong> — {{ c.desc }}<br><small>Expires: {{ c.expires }}</small>
        </div>
        <button class="btn btn-outline-primary">Apply</button>
    </li>
    {% endfor %}
</ul>
{% endblock %}
